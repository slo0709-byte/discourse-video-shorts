plugins:
  video_shorts_enabled:
    default: false
    client: true
  video_shorts_source_category_ids:
    default: ""
    type: category_list
  video_shorts_source_tag_names:
    default: ""
    type: tag_list
  video_shorts_excerpt_character_limit:
    default: 120
    min: 1
    client: true
  video_shorts_page_size:
    default: 20
    min: 1
  video_shorts_candidate_scan_limit:
    default: 500
    min: 1
  video_shorts_debug_mode:
    default: false
    client: false
  video_shorts_canary_group_ids:
    default: ""
    type: group_list
    allow_any: false
